<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gist: AI Web Summarizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='.55' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='15' width='13' height='3' rx='1.5' fill='%23fff' opacity='.85'/%3E%3Crect x='7' y='21' width='8' height='3' rx='1.5' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='23.5' cy='22.5' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#3b82f6;--purple:#a855f7;--green:#10b981}
*{box-sizing:border-box}
body{margin:0;padding:40px 16px 80px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{max-width:1120px;margin:0 auto;padding-top:20vh;transition:padding-top .5s ease}
main.active{padding-top:0}
.top{max-width:720px;margin:0 auto;text-align:center}
.top .row{text-align:left}
.results{display:none;margin-top:20px;gap:20px;align-items:start}
.results.show{display:grid;grid-template-columns:7fr 3fr}
.col-main{min-width:0;animation:slideLeft .5s ease}
.col-side{display:flex;flex-direction:column;gap:16px;min-width:0;animation:popIn .5s ease .1s both}
@keyframes slideLeft{from{transform:translateX(12%);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:860px){.results.show{grid-template-columns:1fr}}
.askbtn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid transparent;border-radius:12px;cursor:pointer;color:var(--text);font-weight:600;text-align:left;
 background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#3b82f6,#a855f7,#10b981) border-box;transition:background .2s}
.askbtn:hover,.askbtn[aria-expanded=true]{background:linear-gradient(#f5f3ff,#eff6ff) padding-box,linear-gradient(90deg,#3b82f6,#a855f7,#10b981) border-box}
.askbtn .orb{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);box-shadow:0 0 10px rgba(168,85,247,.35);display:grid;place-items:center;flex:none}
.askbtn .orb::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.askbtn .count{margin-left:auto;font-weight:500;font-size:.82rem;color:var(--muted)}
.tabcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabstrip{display:flex;gap:2px;padding:8px 8px 0;background:#f1f5f9;border-bottom:1px solid var(--line)}
.tabbtn{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:.9rem;margin-bottom:-1px}
.tabbtn:hover{background:rgba(255,255,255,.6)}
.tabbtn.on{background:#fff;color:var(--text);font-weight:600;border-color:var(--line);padding-bottom:9px}
.tabbtn .n{font-size:.75rem;font-weight:500;color:var(--muted);background:#e2e8f0;border-radius:99px;padding:0 7px}
.tabbtn.on .n{background:#ede9fe;color:#6d28d9}
.tabpanel{height:420px;overflow:auto;padding:16px 18px}
#p-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.followup{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#chat{margin-top:12px}
@keyframes popIn{from{opacity:0;transform:translateX(28px) scale(.97)}to{opacity:1;transform:none}}
h1{font-size:2rem;margin:0;letter-spacing:-.02em;line-height:1.1;text-align:left}
h1 .g{font-weight:700}
h1 .rest{font-weight:500;color:var(--muted)}
.brand{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;margin-bottom:10px}
.brand svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 4px 10px rgba(99,102,241,.3))}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;border-radius:10px}
input[type=url],input[type=text]{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid transparent;border-radius:12px;
 background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#e2e8f0,#e2e8f0) border-box;transition:box-shadow .2s}
input[type=url]:hover,input[type=text]:hover{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#cbd5e1,#cbd5e1) border-box}
input[type=url]:focus,input[type=text]:focus{outline:none;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#3b82f6,#a855f7,#10b981,#3b82f6) border-box;background-size:100% 100%,300% 100%;
 animation:borderflow 3s linear infinite;box-shadow:0 0 0 4px rgba(168,85,247,.12),0 8px 20px -10px rgba(99,102,241,.6)}
@keyframes borderflow{to{background-position:0 0,300% 0}}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
select{padding:11px 10px;border:1px solid var(--line);background:#fff}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:0;border-radius:12px;font-weight:600;color:#fff;cursor:pointer;overflow:hidden;
 background:linear-gradient(135deg,#3b82f6,#a855f7);box-shadow:0 6px 16px -4px rgba(99,102,241,.55);transition:transform .15s,box-shadow .2s}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s ease}
.btn:hover::before{transform:translateX(120%)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px rgba(99,102,241,.6)}
.btn:active{transform:translateY(0);box-shadow:0 4px 10px -4px rgba(99,102,241,.5)}
.btn:disabled{background:linear-gradient(135deg,#bfdbfe,#e9d5ff);box-shadow:none;transform:none;cursor:not-allowed}
.btn:disabled::before{display:none}
.btn svg{width:16px;height:16px;fill:#fff;flex:none}
.ghost{padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;font-size:.9rem;display:inline-block}
.ghost:hover{background:var(--bg)}
#error{display:none;margin-top:16px;padding:12px 14px;background:#fef2f2;color:#b91c1c;border-radius:10px}
#result{display:none}
#result.busy .body{opacity:.45;pointer-events:none}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head h2{font-size:1.1rem;margin:0}
.host{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:8px;align-items:center}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:38px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:grid;min-width:150px;box-shadow:0 8px 24px rgba(15,23,42,.1)}
.pop button{border:0;background:none;text-align:left;padding:8px 10px;cursor:pointer;border-radius:6px}
.pop button:hover{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:.82rem;color:#334155;background:#fff}
.chip.key{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.chip.ind{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}
.summary{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.summary p{margin:0 0 12px}
.summary ul{margin:0;padding-left:20px}
mark{background:#ede9fe;color:#4c1d95;border-radius:3px;padding:0 2px}
.grp{margin-bottom:14px}
.grp h3{font-size:.85rem;color:var(--muted);margin:0 0 4px;font-weight:600}
.grp a,.grp span{display:block;word-break:break-all;font-size:.92rem;padding:2px 0}
a{color:#2563eb}
.empty{color:var(--muted)}
.msgs{display:grid;gap:8px;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}
.msg.u{background:var(--blue);color:#fff;justify-self:end}
.msg.a{background:var(--bg);border:1px solid var(--line)}
.left{color:var(--muted);font-size:.85rem;margin-top:6px}

/* Loading animation (from your pipeline file) */
#loader{display:none;max-width:720px;margin:20px auto 0}
.stepper-header{display:flex;justify-content:space-between;position:relative;margin-bottom:24px;padding:0 10px}
.stepper-line-bg{position:absolute;top:15px;left:30px;right:30px;height:3px;background:#f1f5f9;z-index:1}
.stepper-line-progress{position:absolute;top:15px;left:30px;height:3px;background:linear-gradient(90deg,#3b82f6,#a855f7,#10b981);z-index:2;width:0%;transition:width .4s ease-in-out;max-width:calc(100% - 60px)}
.step-node{position:relative;z-index:3;width:32px;height:32px;background:#fff;border:2px solid #cbd5e1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#94a3b8;transition:all .4s ease}
.step-node.active{border-color:#3b82f6;color:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.25);background:#eff6ff}
.step-node.completed{border-color:#10b981;background:#ecfdf5;color:#10b981}
.animation-viewport{position:relative;width:100%;height:200px;background:var(--bg);border:1px solid #f1f5f9;border-radius:16px;overflow:hidden}
.stage-view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.stage-view.active-view{display:flex}
.load-label{text-align:center;color:var(--muted);font-size:.9rem;margin-top:12px}
.mock-input-bar{width:85%;background:#fff;border:2px solid #3b82f6;border-radius:10px;padding:10px 14px;display:flex;align-items:center;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);animation:bounceIn .6s cubic-bezier(.175,.885,.32,1.275)}
.url-dot{width:8px;height:8px;background:#ef4444;border-radius:50%;margin-right:8px;flex:none}
.url-string{font-family:monospace;color:#475569;font-size:13px;white-space:nowrap;overflow:hidden;border-right:2px solid #3b82f6;width:0;animation:typeUrl 1.8s steps(30) forwards .4s}
.scraper-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:70%}
.code-chunk{height:12px;background:#e2e8f0;border-radius:4px;transition:all .3s ease}
.code-chunk.scraped{background:#a855f7;animation:flashExtract .5s ease-in-out}
.neural-summarizer{width:80%;height:100px;display:flex;align-items:center;justify-content:space-between}
.input-stream{display:flex;flex-direction:column;gap:6px;width:35%}
.in-token{height:6px;background:#cbd5e1;border-radius:3px;animation:ingestToken 1.5s infinite ease-in-out}
.in-token:nth-child(2){animation-delay:.2s;width:80%}.in-token:nth-child(3){animation-delay:.4s;width:65%}.in-token:nth-child(4){animation-delay:.6s;width:90%}
.ai-core-node{width:44px;height:44px;background:linear-gradient(135deg,#a855f7,#6366f1);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(168,85,247,.4);position:relative;animation:corePulse 1.5s infinite alternate ease-in-out}
.ai-core-node::after{content:'';position:absolute;width:60px;height:60px;border:2px dashed rgba(168,85,247,.5);border-radius:50%;animation:coreSpin 6s infinite linear}
.core-sparkle{width:14px;height:14px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;animation:sparkleFlash 1s infinite alternate}
.output-stream{display:flex;flex-direction:column;gap:8px;width:35%;align-items:flex-end}
.out-vector{height:8px;background:#10b981;border-radius:4px;box-shadow:0 0 8px rgba(16,185,129,.3);animation:emitVector 1.5s infinite ease-in-out}
.out-vector:nth-child(1){width:70%;animation-delay:.5s}.out-vector:nth-child(2){width:90%;animation-delay:.8s}.out-vector:nth-child(3){width:50%;animation-delay:1.1s}
.summary-card-output{width:80%;display:flex;flex-direction:column;gap:12px}
.summary-line-item{display:flex;align-items:flex-start;gap:10px;transform:translateY(20px);opacity:0;animation:slideUpDone .5s forwards ease-out}
.check-icon{width:16px;height:16px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold;flex:none}
.text-skeleton{flex:1;height:14px;background:#e2e8f0;border-radius:4px;position:relative;overflow:hidden}
.text-skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#e2e8f0 0%,#f1f5f9 50%,#e2e8f0 100%);background-size:200% 100%;animation:shimmer 1.5s infinite linear}
@keyframes typeUrl{to{width:100%;border-color:transparent}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.05);opacity:.8}100%{transform:scale(1);opacity:1}}
@keyframes flashExtract{0%{background:#c084fc;transform:scale(1.1)}100%{background:#a855f7;transform:scale(1)}}
@keyframes slideUpDone{to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes ingestToken{0%{transform:translateX(-10px);opacity:.2}50%{transform:translateX(0);opacity:1}100%{transform:translateX(10px);opacity:.2}}
@keyframes emitVector{0%{transform:translateX(10px);opacity:.2}50%{transform:translateX(0);opacity:1}100%{transform:translateX(-10px);opacity:.2}}
@keyframes corePulse{0%{transform:scale(.9);box-shadow:0 0 10px rgba(168,85,247,.3)}100%{transform:scale(1.1);box-shadow:0 0 25px rgba(168,85,247,.7)}}
@keyframes coreSpin{100%{transform:rotate(360deg)}}
@keyframes sparkleFlash{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.2);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* ---- intro animation ---- */
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:3;pointer-events:none}
.ch{white-space:pre}
.intro .ch{display:none}
.intro .ch.on{display:inline}
.intro .brand{will-change:transform}
.intro .brand svg{opacity:0}
.intro .brand svg.show{opacity:1;animation:logoPop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes logoPop{0%{transform:scale(.3);filter:drop-shadow(0 0 0 rgba(168,85,247,0))}60%{transform:scale(1.15);filter:drop-shadow(0 0 28px rgba(168,85,247,.8))}100%{transform:scale(1)}}
.caret{display:inline-block;width:2px;height:1em;margin:0 -2px 0 0;vertical-align:-.12em;background:var(--blue);animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.top .sub,.top .card{transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.3,1.25)}
.top .card{transition-delay:.12s}
.intro .top .sub,.intro .top .card{opacity:0;transform:translateY(14px) scale(.94);pointer-events:none}
@media (max-width:560px){.brand svg{width:44px;height:44px}h1{font-size:1.2rem}}
.langwrap{position:relative}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:#475569;border-radius:12px;cursor:pointer;padding:0;transition:background .15s,color .15s,border-color .15s}
.iconbtn:hover,.iconbtn[aria-expanded=true]{background:var(--bg);color:var(--text)}
.iconbtn svg{width:21px;height:21px;fill:currentColor}
.iconbtn.set{color:#6d28d9;border-color:#ddd6fe;background:#f5f3ff}
.langmenu{position:absolute;right:0;top:50px;z-index:20;width:176px;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(15,23,42,.12);animation:menuIn .15s ease}
.langmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:.92rem;color:var(--text)}
.langmenu button:hover{background:var(--bg)}
.langmenu button.on{color:#6d28d9;font-weight:600}
.langmenu button.on::after{content:"";width:5px;height:9px;border:solid #6d28d9;border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 3px 0}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="intro">
<canvas id="fx" aria-hidden="true"></canvas>
<main id="main">
<div class="top">
  <div class="brand"><svg viewBox="0 0 32 32" role="img" aria-label="Gist logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><rect x="7" y="9" width="18" height="3" rx="1.5" fill="#fff"/><rect x="7" y="15" width="13" height="3" rx="1.5" fill="#fff" opacity=".85"/><rect x="7" y="21" width="8" height="3" rx="1.5" fill="#fff" opacity=".7"/><circle cx="23.5" cy="22.5" r="3" fill="#fff"/></svg><h1 id="brandText"><span class="g">Gist</span><span class="rest"> - AI Web Summarizer</span></h1></div>
  <p class="sub">Paste a link and get the gist: summary, keywords, contacts and links.</p>

  <div class="card">
    <div class="row">
      <input id="url" type="url" placeholder="https://example.com" aria-label="Web page URL">
      <select id="lang" hidden aria-hidden="true">
        <option>English</option><option>Hindi</option><option>Telugu</option><option>Tamil</option>
        <option>Kannada</option><option>Malayalam</option><option>Marathi</option><option>Bengali</option>
        <option>Spanish</option><option>French</option><option>German</option><option>Japanese</option><option>Arabic</option>
      </select>
      <div class="langwrap"><button type="button" class="iconbtn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language: English" title="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg></button><div class="langmenu" id="langMenu" role="menu" hidden></div></div>
      <button id="go" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>Summarize</button>
    </div>
    <div id="error" role="alert"></div>
  </div>

</div>

  <!-- Loading -->
  <div id="loader" class="card" aria-live="polite">
    <div class="stepper-header">
      <div class="stepper-line-bg"></div><div id="bar" class="stepper-line-progress"></div>
      <div class="step-node" id="n1">1</div><div class="step-node" id="n2">2</div>
      <div class="step-node" id="n3">3</div><div class="step-node" id="n4">4</div>
    </div>
    <div class="animation-viewport">
      <div id="v1" class="stage-view"><div class="mock-input-bar"><div class="url-dot"></div><div class="url-string" id="typed"></div></div></div>
      <div id="v2" class="stage-view"><div class="scraper-grid" id="grid"></div></div>
      <div id="v3" class="stage-view"><div class="neural-summarizer">
        <div class="input-stream"><div class="in-token" style="width:100%"></div><div class="in-token"></div><div class="in-token"></div><div class="in-token"></div></div>
        <div class="ai-core-node"><div class="core-sparkle"></div></div>
        <div class="output-stream"><div class="out-vector"></div><div class="out-vector"></div><div class="out-vector"></div></div>
      </div></div>
      <div id="v4" class="stage-view"><div class="summary-card-output">
        <div class="summary-line-item" style="animation-delay:.1s"><div class="check-icon">✓</div><div class="text-skeleton" style="width:100%"></div></div>
        <div class="summary-line-item" style="animation-delay:.3s"><div class="check-icon">✓</div><div class="text-skeleton" style="width:85%"></div></div>
        <div class="summary-line-item" style="animation-delay:.5s"><div class="check-icon">✓</div><div class="text-skeleton" style="width:65%"></div></div>
      </div></div>
    </div>
    <div class="load-label" id="loadLabel">Loading...</div>
  </div>

<div class="results" id="layout">
<div class="col-main">
  <!-- Result -->
  <div id="result" class="card">
    <div class="head">
      <div><h2 id="title"></h2><div class="host" id="host"></div></div>
      <div class="actions">
        <a id="visit" class="ghost" target="_blank" rel="noopener noreferrer">Visit site</a>
        <details class="menu"><summary class="ghost">Export</summary>
          <div class="pop"><button data-x="md">Markdown (.md)</button><button data-x="json">JSON (.json)</button><button data-x="copy">Copy summary</button></div>
        </details>
      </div>
    </div>
    <div class="body">
      <div class="chips" id="chips"></div>
      <div class="summary"><p id="sum"></p><ul id="take"></ul></div>
    </div>
    <div class="followup">
      <button class="askbtn" id="askBtn" aria-expanded="false"><span class="orb"></span><span>Ask a follow-up</span><span class="count" id="askCount">3 left</span></button>
      <div id="chat" hidden>
        <div class="msgs" id="msgs"></div>
        <div class="row"><input id="q" type="text" placeholder="Ask about this page" maxlength="300" aria-label="Your question"><button id="ask" class="btn">Send</button></div>
        <div class="left" id="left">3 questions left</div>
      </div>
    </div>
  </div>
</div>

<aside class="col-side" id="side">
  <div class="tabcard">
    <div class="tabstrip" role="tablist">
      <button class="tabbtn on" data-t="contacts" role="tab">Contacts <span class="n" id="cnt-contacts">0</span></button>
      <button class="tabbtn" data-t="links" role="tab">Links <span class="n" id="cnt-links">0</span></button>
    </div>
    <div class="tabpanel" id="p-contacts"></div>
    <div class="tabpanel" id="p-links" hidden></div>
  </div>
</aside>
</div>
</main>

<script>
window.addEventListener("error", (e) => alert("Script error: " + e.message));
window.addEventListener("unhandledrejection", (e) => alert("Error: " + ((e.reason && e.reason.message) || e.reason)));
(function () {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => esc(s).replace(/==(.+?)==/g, "<mark>$1</mark>").replace(/==/g, "");
const plain = (s) => String(s ?? "").replace(/==/g, "");

let base = null, baseLang = "English", data = null, left = 3;

/* ---------- loader ---------- */
const grid = $("grid");
for (let i = 0; i < 16; i++) { const d = document.createElement("div"); d.className = "code-chunk"; grid.appendChild(d); }
let timers = [];
const labels = ["Reading the link...", "Scraping the page...", "Summarizing with AI...", "Done"];
function stage(n) {
  for (let i = 1; i <= 4; i++) {
    $("n" + i).className = "step-node" + (i < n ? " completed" : i === n ? " active" : "");
    $("v" + i).className = "stage-view" + (i === n ? " active-view" : "");
  }
  $("bar").style.width = ["0%", "33.3%", "66.6%", "100%"][n - 1];
  $("loadLabel").textContent = labels[n - 1];
  if (n === 2) document.querySelectorAll(".code-chunk").forEach((c, i) => { c.className = "code-chunk"; timers.push(setTimeout(() => (c.className = "code-chunk scraped"), i * 100)); });
}
function startLoader(url) {
  let host = url; try { host = new URL(url).href.replace(/^https?:\/\//, ""); } catch {}
  $("typed").textContent = host.slice(0, 38);
  $("loader").style.display = "block"; stage(1);
  timers.push(setTimeout(() => stage(2), 2400), setTimeout(() => stage(3), 4600));
}
async function stopLoader() {
  timers.forEach(clearTimeout); timers = [];
  stage(4); await new Promise((r) => setTimeout(r, 900));
  $("loader").style.display = "none";
}

/* ---------- api ---------- */
const API = location.protocol === "file:" ? "https://ai-web-summarizer-e4gt.onrender.com" : "";
async function api(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const showError = (m) => { $("error").textContent = m; $("error").style.display = m ? "block" : "none"; };

/* ---------- render ---------- */
function render() {
  const d = data, k = d.keywords || {};
  $("title").textContent = d.title; $("host").textContent = new URL(d.url).hostname;
  $("visit").href = d.url;
  const chips = [];
  if (k.about) chips.push(["key", k.about]);
  if (k.industry) chips.push(["ind", k.industry]);
  [...(k.companies || []), ...(k.people || []), ...(k.locations || []), ...(k.topics || [])].forEach((x) => chips.push(["", x]));
  $("chips").innerHTML = chips.map(([c, t]) => `<span class="chip ${c}">${esc(t)}</span>`).join("");
  $("sum").innerHTML = fmt(d.summary);
  $("take").innerHTML = (d.takeaways || []).map((t) => `<li>${fmt(t)}</li>`).join("");

  const c = d.contacts, grp = (h, items, mk) => items.length ? `<div class="grp"><h3>${h}</h3>${items.map(mk).join("")}</div>` : "";
  const html = grp("Emails", c.emails, (e) => `<a href="mailto:${esc(e)}">${esc(e)}</a>`) +
    grp("Phone numbers", c.phones, (p) => `<a href="tel:${esc(p.replace(/[^\d+]/g, ""))}">${esc(p)}</a>`) +
    grp("Social profiles", c.socials, (s) => `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s.replace(/^https?:\/\/(www\.)?/, ""))}</a>`) +
    grp("Addresses", c.addresses, (a) => `<span>${esc(a)}</span>`);
  $("p-contacts").innerHTML = html || '<p class="empty">No contact details found on this page.</p>';

  const list = (arr) => arr.map((l) => `<a href="${esc(l.url)}" title="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.text || l.url)}</a>`).join("");
  const L = d.links;
  $("p-links").innerHTML = (L.internal.length ? `<div class="grp"><h3>On this site (${L.internal.length})</h3>${list(L.internal)}</div>` : "") +
    (L.external.length ? `<div class="grp"><h3>Other sites (${L.external.length})</h3>${list(L.external)}</div>` : "") ||
    '<p class="empty">No links found.</p>';
  $("cnt-contacts").textContent = c.emails.length + c.phones.length + c.socials.length + c.addresses.length;
  $("cnt-links").textContent = L.internal.length + L.external.length;
}
function setLeft(n) {
  left = n; $("askCount").textContent = n ? `${n} left` : "limit reached";
  $("left").textContent = n ? `${n} question${n > 1 ? "s" : ""} left` : "No follow-up questions left for this page.";
  $("ask").disabled = $("q").disabled = !n;
}

/* ---------- actions ---------- */
async function summarize() {
  const url = $("url").value.trim(); if (!url) return;
  showError(""); $("result").style.display = "none"; $("layout").classList.remove("show"); $("main").classList.add("active"); $("go").disabled = true;
  startLoader(url);
  try {
    const lang = $("lang").value;
    const res = await api("/api/summarize", { url, language: lang });
    await stopLoader();
    base = res; baseLang = lang; data = res;
    $("msgs").innerHTML = ""; $("chat").hidden = true; $("askBtn").setAttribute("aria-expanded", "false"); setLeft(3);
    render(); $("result").style.display = "block"; $("layout").classList.add("show");
  } catch (e) {
    timers.forEach(clearTimeout); timers = []; $("loader").style.display = "none"; showError(e.message);
  } finally { $("go").disabled = false; }
}

async function translate() {
  if (!base) return;
  const lang = $("lang").value;
  $("result").classList.add("busy");
  try {
    const t = lang === baseLang ? base : await api("/api/translate", { data: base, language: lang });
    data = { ...base, summary: t.summary, takeaways: t.takeaways, keywords: t.keywords };
    render(); showError("");
  } catch (e) { showError(e.message); }
  $("result").classList.remove("busy");
}

async function ask() {
  const q = $("q").value.trim(); if (!q || !left) return;
  $("q").value = ""; $("ask").disabled = true;
  const add = (c, t) => { const d = document.createElement("div"); d.className = "msg " + c; d.textContent = t; $("msgs").appendChild(d); return d; };
  add("u", q); const wait = add("a", "Thinking...");
  try {
    const r = await api("/api/chat", { id: base.id, question: q, language: $("lang").value });
    wait.textContent = r.answer; setLeft(r.remaining);
  } catch (e) { wait.textContent = e.message; $("ask").disabled = left === 0; }
}

function download(name, type, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportAs(kind) {
  const d = data, k = d.keywords || {}, c = d.contacts;
  const kw = [k.about, k.industry, ...(k.companies || []), ...(k.people || []), ...(k.locations || []), ...(k.topics || [])].filter(Boolean);
  const text = `${plain(d.summary)}\n\n${(d.takeaways || []).map((t) => "- " + plain(t)).join("\n")}`;
  if (kind === "copy") return navigator.clipboard.writeText(text);
  const name = new URL(d.url).hostname.replace(/\W+/g, "-");
  if (kind === "json") return download(name + ".json", "application/json", JSON.stringify({ ...d, id: undefined }, null, 2));
  const md = `# ${d.title}\n${d.url}\n\n**Keywords:** ${kw.join(", ")}\n\n## Summary\n${text}\n\n## Contacts\n` +
    [...c.emails, ...c.phones, ...c.socials, ...c.addresses].map((x) => "- " + x).join("\n") +
    `\n\n## Links\n` + [...d.links.internal, ...d.links.external].map((l) => `- [${l.text || l.url}](${l.url})`).join("\n");
  download(name + ".md", "text/markdown", md);
}

$("go").onclick = summarize;
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") summarize(); });
$("lang").onchange = translate;
$("ask").onclick = ask;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
document.querySelectorAll(".tabbtn").forEach((b) => (b.onclick = () => {
  document.querySelectorAll(".tabbtn").forEach((x) => x.classList.toggle("on", x === b));
  $("p-contacts").hidden = b.dataset.t !== "contacts";
  $("p-links").hidden = b.dataset.t !== "links";
}));
$("askBtn").onclick = () => {
  const open = $("chat").hidden;
  $("chat").hidden = !open; $("askBtn").setAttribute("aria-expanded", String(open));
  if (open) $("q").focus();
};
document.querySelectorAll(".pop button").forEach((b) => (b.onclick = () => { exportAs(b.dataset.x); b.closest("details").open = false; }));
})();
</script>
<script>
/* ===== INTRO: blobs drift very slowly -> HALF fuse into the logo (fast), the OTHER half move away and fade -> logo -> name types -> title shrinks while moving up -> UI pops ===== */
(function () {
  const $ = (id) => document.getElementById(id);
  const body = document.body, brand = document.querySelector(".brand"), h1 = $("brandText"), svg = document.querySelector(".brand svg"), cv = $("fx");
  const ctx = cv.getContext && cv.getContext("2d");
  const T_CONV = 1000, T_LOGO = 1850, T_TYPE = 2150, CH = 28, FX_END = 2500;       // ms
  const MOVE_MS = 900;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeInOut = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

  // split the name into single characters so they can be typed one by one
  const chars = [];
  h1.querySelectorAll("span").forEach((span) => {
    const t = span.textContent; span.textContent = "";
    for (const c of t) { const e = document.createElement("span"); e.className = "ch"; e.textContent = c; span.appendChild(e); chars.push(e); }
  });
  const caret = document.createElement("span"); caret.className = "caret";

  // soft, blunt blob in the logo's colours (stacked rounded squares = blur)
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  const sprite = document.createElement("canvas"); sprite.width = sprite.height = 64;
  const sc = sprite.getContext && sprite.getContext("2d");
  if (sc) {
    const g = sc.createLinearGradient(0, 0, 64, 64);
    g.addColorStop(0, "#3b82f6"); g.addColorStop(.55, "#a855f7"); g.addColorStop(1, "#10b981");
    sc.fillStyle = g;
    for (let i = 0; i < 12; i++) { const inset = 4 + i * 2.2, s = 64 - inset * 2; sc.globalAlpha = .12; rr(sc, inset, inset, s, s, Math.max(6, s * .32)); sc.fill(); }
    sc.globalAlpha = 1;
  }

  let parts = [], t0 = 0, raf = 0, running = false;
  let shown, typed, shrunk, moved, popped, cleared, tMove, dx, dy, scale;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // every blob gets its own direction, number of turns, speed, easing and wobble -> no repeating pattern
  function makeParticles() {          // random spots; they drift very slowly, then half fuse into the logo and half move away
    const n = innerWidth < 600 ? 110 : 260;
    return Array.from({ length: n }, (_, i) => {
      const fuse = i % 2 === 0;
      return {
        bx: Math.random() * innerWidth, by: Math.random() * innerHeight,
        s: rand(14, 32), a: rand(.4, .9),
        vx: rand(-22, 22), vy: rand(-22, 22),                                                    // slow drift (px per second)
        ax: rand(5, 12), ay: rand(5, 12), w: rand(.8, 1.6), ph: rand(0, 6.28), ph2: rand(0, 6.28), // very slow sway
        fuse, d: fuse ? rand(0, 300) : rand(0, 400), dur: fuse ? rand(650, 1050) : rand(700, 1100),
        far: rand(160, 420)                                                                      // how far a blob moves away
      };
    });
  }

  function setBrand(tr, ms, ease) { brand.style.transition = ms ? "transform " + ms + "ms " + ease : "none"; brand.style.transform = tr; }
  function placeBrand() {              // big, in the middle of the screen
    setBrand("none", 0);
    chars.forEach((c) => (c.style.display = "inline"));           // measure with the full name
    const r = brand.getBoundingClientRect();
    chars.forEach((c) => (c.style.display = ""));
    scale = Math.min(1.5, innerWidth * .92 / (r.width || 1));
    dx = innerWidth / 2 - (r.left + r.width / 2); dy = innerHeight / 2 - (r.top + r.height / 2);
    setBrand("translate(" + dx + "px," + dy + "px) scale(" + scale + ")", 0);
  }

  function frame(now) {
    if (!running) return;
    const t = now - t0, W = innerWidth, H = innerHeight;

    if (ctx && t < FX_END) {
      ctx.clearRect(0, 0, W, H);
      const r = svg.getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height / 2, ts = t / 1000;
      for (const p of parts) {
        let x = p.bx + p.vx * ts + Math.sin(ts * p.w + p.ph) * p.ax, y = p.by + p.vy * ts + Math.cos(ts * p.w * .8 + p.ph2) * p.ay;
        let s = p.s, a = p.a * Math.min(1, t / 250);
        const k = clamp((t - T_CONV - p.d) / p.dur, 0, 1);
        if (k > 0) {
          const e = k * k * (3 - 2 * k);                       // smooth start and finish
          if (p.fuse) {                                        // this half melts into the logo
            x += (tx - x) * e; y += (ty - y) * e; s *= 1 - .85 * e;
            if (k > .85) a *= (1 - k) / .15;
          } else {                                             // this half moves away from the logo and fades
            const ux = x - tx, uy = y - ty, dist = Math.hypot(ux, uy) || 1;
            x += ux / dist * p.far * e; y += uy / dist * p.far * e; a *= 1 - e;
          }
        }
        if (a <= .01) continue;
        ctx.globalAlpha = a; ctx.drawImage(sprite, x - s / 2, y - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
    } else if (ctx && !cleared) { ctx.clearRect(0, 0, W, H); cleared = true; }

    if (!shown && t >= T_LOGO) { shown = true; svg.classList.add("show"); }   // logo forms in the middle

    if (t >= T_TYPE) {                 // typing: the pair stays centred, so the logo slides left as the text grows
      const n = Math.min(chars.length, Math.floor((t - T_TYPE) / CH) + 1);
      while (typed < n) { chars[typed].classList.add("on"); chars[typed].after(caret); typed++; }
    }
    const tyEnd = T_TYPE + chars.length * CH;
    if (typed === chars.length && !moved && t >= tyEnd + 120) {            // shrink + move up as ONE smooth motion
      moved = true; tMove = t; caret.remove();
      setBrand("translate(0px,0px) scale(1)", MOVE_MS, "cubic-bezier(.45,0,.2,1)");
    }
    if (moved && !popped && t >= tMove + MOVE_MS + 60) { popped = true; body.classList.remove("intro"); }   // input + buttons pop up only after the title has arrived
    if (popped && t >= tMove + MOVE_MS + 850) return finish();
    raf = requestAnimationFrame(frame);
  }

  function finish() {                  // also used to skip
    running = false; cancelAnimationFrame(raf);
    chars.forEach((c) => c.classList.add("on"));
    svg.classList.add("show"); body.classList.remove("intro");
    brand.style.transition = ""; brand.style.transform = "";
    cv.style.display = "none"; caret.remove();
    document.removeEventListener("pointerdown", finish); document.removeEventListener("keydown", finish);
  }

  function start() {
    cancelAnimationFrame(raf);
    body.classList.add("intro"); chars.forEach((c) => c.classList.remove("on")); svg.classList.remove("show"); caret.remove();
    cv.style.display = "block"; resize(); parts = makeParticles(); placeBrand();
    shown = false; typed = 0; shrunk = false; moved = false; popped = false; cleared = false; running = true; t0 = performance.now();
    document.addEventListener("pointerdown", finish, { once: true }); document.addEventListener("keydown", finish, { once: true });
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => running && resize());
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  reduce ? finish() : start();
})();
</script>
<script>
/* ===== language picker: icon button + popup list (drives the hidden <select id="lang">) ===== */
(function () {
  const sel = document.getElementById("lang"), btn = document.getElementById("langBtn"), menu = document.getElementById("langMenu");
  [...sel.options].forEach((o) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "menuitemradio"); b.textContent = o.value; b.dataset.v = o.value;
    b.onclick = () => { sel.value = o.value; sel.dispatchEvent(new Event("change")); sync(); close(); };
    menu.appendChild(b);
  });
  function sync() {
    menu.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === sel.value));
    btn.classList.toggle("set", sel.value !== "English");
    btn.setAttribute("aria-label", "Language: " + sel.value);
  }
  function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  btn.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); };
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  sync();
})();
</script>
